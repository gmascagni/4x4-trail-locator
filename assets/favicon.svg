<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="100" height="100" rx="22" fill="url(#gradBg)" stroke="#334155" stroke-width="3"/>
  
  <!-- Iconic 4x4 Jeep Round Headlights -->
  <circle cx="23" cy="46" r="10.5" fill="url(#gradOrange)"/>
  <circle cx="77" cy="46" r="10.5" fill="url(#gradOrange)"/>
  <circle cx="23" cy="46" r="6.5" fill="#ffffff"/>
  <circle cx="77" cy="46" r="6.5" fill="#ffffff"/>
  
  <!-- 7 Signature Grille Slots -->
  <rect x="36" y="32" width="3.5" height="28" rx="1.75" fill="#ffffff"/>
  <rect x="42" y="32" width="3.5" height="28" rx="1.75" fill="#ffffff"/>
  <rect x="48" y="32" width="3.5" height="28" rx="1.75" fill="#ffffff"/>
  <rect x="54" y="32" width="3.5" height="28" rx="1.75" fill="#ffffff"/>
  <rect x="60" y="32" width="3.5" height="28" rx="1.75" fill="#ffffff"/>
  
  <!-- 4X4 Bold Label -->
  <text x="50" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#f97316" text-anchor="middle" letter-spacing="2">4X4</text>
</svg>