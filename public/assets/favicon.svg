<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14281d"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Tactical Shield / Diamond -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#shieldGrad)" stroke="#ea580c" stroke-width="4.5"/>
  
  <!-- Mountain Summit Peak -->
  <polygon points="50,16 80,62 20,62" fill="url(#orangeGrad)"/>
  <polygon points="50,16 64,62 36,62" fill="#fdba74"/>
  <!-- Mountain Snowcap -->
  <polygon points="50,16 58,32 50,28 42,32" fill="#ffffff"/>
  
  <!-- Rugged 4x4 Tire Tread Tracks at Base -->
  <rect x="22" y="68" width="10" height="5" rx="1.5" fill="#f8fafc"/>
  <rect x="36" y="68" width="10" height="5" rx="1.5" fill="#f8fafc"/>
  <rect x="54" y="68" width="10" height="5" rx="1.5" fill="#f8fafc"/>
  <rect x="68" y="68" width="10" height="5" rx="1.5" fill="#f8fafc"/>

  <!-- Compass Star Center Highlight -->
  <polygon points="50,34 54,48 50,54 46,48" fill="#ffffff"/>
  
  <!-- Bold 4X4 Label -->
  <text x="50" y="87" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="14" fill="#fbbf24" text-anchor="middle" letter-spacing="2">4X4</text>
</svg>